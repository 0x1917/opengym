# Publish the image that `build.yml` built and smoke-tested.
#
# Chained with `workflow_run`: it fires when the build workflow completes, then
# downloads that exact run's artifact, proves the loaded image is the tested one
# (image ID from meta.json, plus the smoke gate run again on the loaded bytes),
# and only then pushes to Docker Hub, tags the source, and cuts the GitHub
# release.
#
# Nothing here can build. The bytes come from the artifact or they do not ship.
#
# The scripts this workflow runs (the smoke test, scripts/version-tag.sh) come
# from the default branch, never from the build run's commit: this job holds a
# write token, so it executes only code already on master. The build run's
# commit is used as data alone, as the target of the source tag.
#
# The release body quotes upstream's changelog for the version. Upstream keeps
# each CHANGELOG.md section identical to that release's GitHub notes, so the
# text says what changed in the app rather than what changed in this packaging.
#
# Docker Hub is the release channel. A copy is also pushed to ghcr.io, best
# effort: it can fail without failing the run, because the git tag and the Hub
# tags are already final by then. A GHCR outage must not leave a red run
# pointing at a published image.
#
# Secrets (Repo Settings > Secrets and Variables > Actions):
#   DOCKERHUB_TOKEN     Docker Hub access token

name: publish

on:
  workflow_run:
    workflows: [build]
    types: [completed]
  # Manual re-publish of a specific build run: pass its run id.
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "The build run ID to publish: Open Actions > Build > Click on the run > Extract the ID from the URL."
        required: true
        type: string

permissions:
  contents: write   # push the source tag and create the release
  actions: read     # download the artifact from the triggering run
  packages: write   # best-effort copy to ghcr.io

# Publishing is serialised across runs: :latest must never be raced by two
# publishes, and the numbered tag series assumes one writer.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: 0x1917/opengym
  GHCR: ghcr.io/0x1917/opengym
  ARTIFACT: opengym-image

jobs:
  publish:
    # Chained runs publish only from master, only after a green build, and only
    # for events that were allowed to publish in the first place.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
    steps:
      # The commit to tag is the BUILD RUN's head, not this workflow's SHA: a
      # manual re-publish names a build run, and its commit is what shipped.
      # The SHA is interpolated into a checkout `ref:` below, so it is validated
      # as a bare commit hash first.
      - name: Resolve and validate the target commit
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in
            *[!0-9]*|"") echo "not a run id: $RUN_ID" >&2; exit 1 ;;
          esac
          # The run decides which commit we trust. Validate the RUN, not only
          # the SHA: a manual dispatch can name any run id, including a build of
          # a fork PR, whose code would then be checked out and executed here
          # with a write token. Only master pushes and master dispatches pass.
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          BRANCH=$(printf '%s' "$RUN" | jq -r .head_branch)
          EVENT=$(printf '%s' "$RUN" | jq -r .event)
          SHA_J=$(printf '%s' "$RUN" | jq -r .head_sha)
          case "$EVENT" in
            push|workflow_dispatch) ;;
            *) echo "build run $RUN_ID came from '$EVENT', refusing" >&2; exit 1 ;;
          esac
          [ "$BRANCH" = "master" ] || { echo "build run $RUN_ID is on '$BRANCH', not master" >&2; exit 1; }
          SHA="$SHA_J"
          [ -z "$WR_SHA" ] || [ "$WR_SHA" = "$SHA" ] || { echo "payload sha disagrees with the run" >&2; exit 1; }
          case "$SHA" in
            *[!0-9a-f]*|"") echo "not a commit sha: $SHA" >&2; exit 1 ;;
          esac
          [ "${#SHA}" -eq 40 ] || { echo "not a commit sha: $SHA" >&2; exit 1; }
          echo "publishing build run $RUN_ID ($SHA) from $EVENT on $BRANCH"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT }}
          # Outside the checkout on purpose: actions/checkout cleans the working
          # tree, which would delete a bundle downloaded into it. `runner` is
          # usable in step inputs but not in `env` blocks.
          path: ${{ runner.temp }}/bundle
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The bundle is uploaded on every build, so a missing tarball here is a
      # permission problem rather than a normal "nothing to publish".
      - name: Read the bundle manifest
        id: meta
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/bundle"
          test -s "$BUNDLE/meta.json" || { echo "no meta.json in the artifact" >&2; exit 1; }
          cat "$BUNDLE/meta.json"
          {
            echo "version=$(jq -r .version "$BUNDLE/meta.json")"
            echo "image_id=$(jq -r .image_id "$BUNDLE/meta.json")"
            echo "publish=$(jq -r .publish "$BUNDLE/meta.json")"
            echo "forced=$(jq -r '.forced // false' "$BUNDLE/meta.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Nothing to publish
        if: steps.meta.outputs.publish != 'true'
        run: echo "that build was not marked for publishing, so this run stops here"

      # Only needed when there is something to push: the smoke script and the
      # tag step both live in the repo. Placed after the manifest read so a
      # non-publish build costs one API call and a 381-byte download. The
      # default branch, not the build run's commit (see the header); fetch-depth
      # 0 brings the target commit and the remote's tags along.
      - uses: actions/checkout@v7
        if: steps.meta.outputs.publish == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the target commit is on master
        if: steps.meta.outputs.publish == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SHA" HEAD \
            || { echo "build run commit $SHA is not on master (force-pushed away?), refusing to tag it" >&2; exit 1; }

      # Re-checked here, not only in build: build decides before an earlier publish
      # has created its tag, so two pushes in quick succession both compare against
      # the old baseline and the second republishes an unchanged image as <ver>-r<n>.
      # Publish runs are serialised, so by now the highest tag is current. A forced
      # build (a base image rebuild) and a manual re-publish of a named build run
      # skip the check: both are explicit requests to push.
      - name: Confirm the image changed since the last release
        id: recheck
        if: steps.meta.outputs.publish == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          FORCED: ${{ steps.meta.outputs.forced }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          LAST=$(git tag -l 'v*' | bash scripts/version-tag.sh --max)
          INPUTS=()
          while IFS= read -r p; do INPUTS+=("$p"); done < <(grep -vE '^[[:space:]]*(#|$)' .github/build-inputs)
          if [ "$FORCED" = true ] || [ "$EVENT" = workflow_dispatch ] || [ -z "$LAST" ] || ! git diff --quiet "$LAST" "$SHA" -- "${INPUTS[@]}"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "no build input changed between $LAST and $SHA (another publish got there first), so nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load the tested image
        if: steps.recheck.outputs.publish == 'true'
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/bundle"
          test -s "$BUNDLE/image.tar.zst" || { echo "artifact has no image tarball" >&2; exit 1; }
          zstd -dc "$BUNDLE/image.tar.zst" | docker load
          GOT=$(docker image inspect --format '{{.Id}}' opengym:test)
          WANT="${{ steps.meta.outputs.image_id }}"
          echo "loaded: $GOT"
          echo "tested: $WANT"
          [ "$GOT" = "$WANT" ] || { echo "the loaded image is not the image that was tested" >&2; exit 1; }

      # The bytes travelled through an artifact store, so the gate runs again on
      # what actually arrived rather than trusting the build run's log.
      - name: Run the smoke test on the loaded image
        if: steps.recheck.outputs.publish == 'true'
        run: bash scripts/smoke-test.sh opengym:test

      # The registry tag mirrors the git source tag, computed here from read-only
      # git state BEFORE anything is pushed: the first publish of a release keeps
      # the bare core version on the registry (1.4.4) for good, a rebuild gets
      # its own numbered tag (1.4.4-r1) instead of overwriting it. `latest` moves
      # only when this run carries the highest tag of the whole series (gate
      # below), so a re-publish of an older build never drags it backwards.
      # Publish runs are serialised by this workflow's concurrency group, so no
      # other run can take a number between this step and the tag step below.
      - name: Resolve the publish tag
        id: pubtag
        if: steps.recheck.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          BASE="v${VERSION}"
          TAG=$(git tag --points-at "$SHA" | bash scripts/version-tag.sh "$VERSION")
          # A tag on this commit is only this run's when its note names this
          # build run. A new build of an already-published commit (a forced
          # dispatch) has different bytes, so it is a rebuild and gets its own
          # number rather than overwriting that tag on the registry.
          if [ -n "$TAG" ] && ! git tag -l --format='%(contents)' "$TAG" | grep -Fq "build run $RUN_ID)"; then
            echo "$TAG on this commit came from another build run, numbering a rebuild"
            TAG=""
          fi
          if [ -n "$TAG" ]; then
            NOTE="Source state published as $IMAGE:${TAG#v} (build run $RUN_ID)"
          elif git ls-remote --exit-code --tags origin "refs/tags/$BASE" >/dev/null 2>&1; then
            # The bare tag is taken: this is a rebuild. Number it -r<n>, after the
            # highest rebuild so far, in either form (tags before the switch to
            # -r<n> were <ver>-<n>).
            N=$(git ls-remote --tags origin | awk -v p="refs/tags/${BASE}-" \
                  'index($2, p) == 1 { n = substr($2, length(p) + 1); sub(/^r/, "", n); if (n ~ /^[0-9]+$/) print n }' \
                  | sort -n | tail -1)
            N=${N:-0}
            TAG="${BASE}-r$((N + 1))"
            NOTE="Rebuild #$((N + 1)) of $IMAGE:$VERSION (release tag already exists, build run $RUN_ID)"
          else
            TAG="$BASE"
            NOTE="Source state published as $IMAGE:$VERSION (build run $RUN_ID)"
          fi
          # `latest` moves only when this run carries the highest tag of the
          # whole series. Peeled `^{}` lines and non-version tags cannot match
          # the pattern. A new tag is not on the remote until the tag step
          # below, so it joins the candidates here: otherwise a first publish
          # or a fresh rebuild would never be the highest and latest would
          # never move.
          HIGHEST_ALL=$({ git ls-remote --tags origin \
                            | awk '{sub(/^refs\/tags\//,"",$2); print $2}'; echo "$TAG"; } \
            | bash scripts/version-tag.sh --max)
          if [ "$TAG" = "$HIGHEST_ALL" ]; then
            PUSH_LATEST=true
          else
            PUSH_LATEST=false
          fi
          {
            echo "tag=$TAG"
            echo "registry_tag=${TAG#v}"
            echo "note=$NOTE"
            echo "push_latest=$PUSH_LATEST"
          } >> "$GITHUB_OUTPUT"
          echo "publish tag: $TAG (registry tag: ${TAG#v}, push_latest=$PUSH_LATEST)"

      - name: Log in to Docker Hub
        if: steps.recheck.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: "0x1917"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The version tag is immutable after its first publish: a rebuild pushes
      # its own numbered tag and leaves the earlier one alone. `latest` moves
      # only when Resolve the publish tag set push_latest=true.
      - name: Tag and push the image
        if: steps.recheck.outputs.publish == 'true'
        env:
          REGISTRY_TAG: ${{ steps.pubtag.outputs.registry_tag }}
          PUSH_LATEST: ${{ steps.pubtag.outputs.push_latest }}
        run: |
          docker tag opengym:test "$IMAGE:$REGISTRY_TAG"
          docker push "$IMAGE:$REGISTRY_TAG"
          if [ "$PUSH_LATEST" = "true" ]; then
            docker tag opengym:test "$IMAGE:latest"
            docker push "$IMAGE:latest"
          else
            echo "not the highest tag of the series, so latest is left alone"
          fi

      - name: Verify the pushed digest
        id: digests
        if: steps.recheck.outputs.publish == 'true'
        env:
          REGISTRY_TAG: ${{ steps.pubtag.outputs.registry_tag }}
          PUSH_LATEST: ${{ steps.pubtag.outputs.push_latest }}
        run: |
          v=$(docker buildx imagetools inspect "$IMAGE:$REGISTRY_TAG" --format '{{.Manifest.Digest}}')
          echo "version: $v"
          if [ "$PUSH_LATEST" = "true" ]; then
            l=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
            echo "latest:  $l"
            [ "$v" = "$l" ]
          else
            echo "latest:  not moved by this run"
          fi
          echo "digest=$v" >> "$GITHUB_OUTPUT"

      # The FIRST publish of a release gets the bare tag (v1.4.3); a rebuild of
      # the same release gets the next number (v1.4.3-r1, -r2), so every publish
      # leaves a tag and none is ever moved. Re-running the same commit is a no-op:
      # it already carries one.
      - name: Create the source tag
        id: tag
        if: steps.recheck.outputs.publish == 'true'
        env:
          TAG: ${{ steps.pubtag.outputs.tag }}
          NOTE: ${{ steps.pubtag.outputs.note }}
          SHA: ${{ steps.target.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Checkout kept no credentials, so the push authenticates here, for
          # this step only, after the image is already published.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The tag name and note were resolved read-only before any push
          # (Resolve the publish tag); this step only creates and pushes it.
          if git tag --points-at "$SHA" | grep -Fxq "$TAG"; then
            echo "this commit already carries $TAG, nothing to tag"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$NOTE" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ---- best-effort mirror to GHCR ----------------------------------
      # Everything below runs after the Hub push, the digest check and the git
      # tag, so a failure here cannot corrupt the release record. Each step is
      # continue-on-error and the last one reports the combined outcome as a
      # warning annotation instead of a red run.
      - name: Log in to GHCR
        id: ghcr_login
        if: steps.recheck.outputs.publish == 'true'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the GHCR copy
        id: ghcr_push
        if: steps.recheck.outputs.publish == 'true'
        continue-on-error: true
        env:
          REGISTRY_TAG: ${{ steps.pubtag.outputs.registry_tag }}
          PUSH_LATEST: ${{ steps.pubtag.outputs.push_latest }}
        run: |
          set -euo pipefail
          docker tag opengym:test "$GHCR:$REGISTRY_TAG"
          docker push "$GHCR:$REGISTRY_TAG"
          if [ "$PUSH_LATEST" = "true" ]; then
            docker tag opengym:test "$GHCR:latest"
            docker push "$GHCR:latest"
          else
            echo "not the highest tag of the series, so ghcr latest is left alone"
          fi

      # Both registries store the same manifest bytes, so the digest is the
      # same content-addressed value on each: compare the GHCR copy against the
      # Hub tag too. A mismatch means the mirror is not carrying the published
      # image. The `latest` pair is compared only when this run moved it.
      - name: Verify the GHCR tags
        id: ghcr_verify
        if: steps.recheck.outputs.publish == 'true'
        continue-on-error: true
        env:
          REGISTRY_TAG: ${{ steps.pubtag.outputs.registry_tag }}
          PUSH_LATEST: ${{ steps.pubtag.outputs.push_latest }}
        run: |
          set -euo pipefail
          v=$(docker buildx imagetools inspect "$GHCR:$REGISTRY_TAG" --format '{{.Manifest.Digest}}')
          h=$(docker buildx imagetools inspect "$IMAGE:$REGISTRY_TAG" --format '{{.Manifest.Digest}}')
          echo "ghcr version: $v"
          echo "hub  version: $h"
          [ "$v" = "$h" ]
          if [ "$PUSH_LATEST" = "true" ]; then
            l=$(docker buildx imagetools inspect "$GHCR:latest" --format '{{.Manifest.Digest}}')
            echo "ghcr latest:  $l"
            [ "$v" = "$l" ]
          else
            echo "ghcr latest:  not moved by this run"
          fi

      - name: GHCR outcome
        if: always() && steps.recheck.outputs.publish == 'true'
        env:
          LOGIN: ${{ steps.ghcr_login.outcome }}
          PUSH: ${{ steps.ghcr_push.outcome }}
          VERIFY: ${{ steps.ghcr_verify.outcome }}
        run: |
          set -uo pipefail
          echo "ghcr login: $LOGIN, push: $PUSH, verify: $VERIFY"
          if [ "$LOGIN" != "success" ] || [ "$PUSH" != "success" ] || [ "$VERIFY" != "success" ]; then
            echo "::warning::GHCR mirror incomplete (login=$LOGIN push=$PUSH verify=$VERIFY); Docker Hub published, treat ${GHCR:-ghcr.io} as unavailable"
          fi

      # ---- the release record -------------------------------------------
      # Last step on purpose: everything it states has already happened, so the
      # body reports the digest that shipped and the mirror outcome instead of a
      # prediction. Upstream's CHANGELOG.md is the changelog: its own header
      # says each release section is the GitHub release notes word for word, so
      # the section for this version is quoted verbatim.
      - name: Create or update the GitHub release
        if: success() && steps.recheck.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.digests.outputs.digest }}
          SHA: ${{ steps.target.outputs.sha }}
          BUILD_RUN: ${{ env.RUN_ID }}
          UPSTREAM: DuarteSantos8/openGym
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${TAG:-}" ] || { echo "no source tag resolved for v$VERSION, refusing to guess" >&2; exit 1; }

          WORK="$RUNNER_TEMP"
          NOTES="$WORK/upstream-notes.md"
          CHANGELOG="$WORK/CHANGELOG.md"

          # Raw media type: the file arrives as bytes, not base64 inside JSON.
          if gh api -H "Accept: application/vnd.github.raw" \
               "repos/$UPSTREAM/contents/CHANGELOG.md" > "$CHANGELOG" 2>/dev/null; then
            awk -v v="$VERSION" '
              $0 ~ "^## v" v "($|[ (])" { on = 1; next }
              on && /^## v/ { exit }
              on { print }
            ' "$CHANGELOG" > "$NOTES"
          else
            : > "$NOTES"
          fi

          # Fallback: the upstream release for the tag, which carries the same text.
          if [ ! -s "$NOTES" ]; then
            echo "no changelog section for v$VERSION, trying the upstream release" >&2
            gh api "repos/$UPSTREAM/releases/tags/v$VERSION" --jq .body > "$NOTES" 2>/dev/null || : > "$NOTES"
          fi
          [ -s "$NOTES" ] || echo "_Upstream published no notes for this version._" > "$NOTES"

          # Pages for the two registries, derived from the image names above:
          # GHCR's package page lives under the repository that publishes it.
          HUB_URL="https://hub.docker.com/r/$IMAGE"
          GHCR_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pkgs/container/${GHCR##*/}"

          BODY="$WORK/release.md"
          {
            printf 'Container image for OpenGym v%s, built from the upstream release at [%s](https://github.com/%s/releases/tag/v%s). Published to [Docker Hub](%s), with a best-effort mirror on [GHCR](%s).\n\n' \
              "$VERSION" "$UPSTREAM" "$UPSTREAM" "$VERSION" "$HUB_URL" "$GHCR_URL"
            printf '| Digest | Tag commit | Build run |\n| --- | --- | --- |\n'
            printf "| \`%s\` | %s | [%s](%s/%s/actions/runs/%s) |\n\n" \
              "${DIGEST:-unknown}" "$SHA" "$BUILD_RUN" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BUILD_RUN"
            printf 'The changelog below is from the upstream [OpenGym v%s](https://github.com/%s/releases/tag/v%s) release, quoted as published.\n\n' "$VERSION" "$UPSTREAM" "$VERSION"
            printf -- '---\n\n'
            printf '## What changed in v%s\n\n' "$VERSION"
            cat "$NOTES"
          } > "$BODY"

          # One release per core version, always pointing at the HIGHEST source
          # tag of that version - the newest publish. Re-publishing an older
          # build refreshes that build's own registry tag without dragging the
          # release back onto an older commit.
          EXISTING=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | bash scripts/version-tag.sh "$VERSION")
          HIGHEST=$(git ls-remote --tags origin | awk '{sub(/^refs\/tags\//,"",$2); print $2}' \
            | bash scripts/version-tag.sh "$VERSION")
          [ -n "$HIGHEST" ] || HIGHEST="$TAG"
          # The notes above describe THIS run's build (its digest, commit and
          # registry tag), so they may only land on the release when this run
          # is the newest publish. A re-publish of an older build leaves the
          # release, and the notes describing the newest build, alone.
          if [ "$TAG" != "$HIGHEST" ]; then
            echo "re-published $TAG, older than $HIGHEST: the release stays as it is"
            exit 0
          fi
          # The list is capped, so a release beyond the cap is looked up directly
          # instead of falling through to a create that would 422 on the tag.
          if [ -z "$EXISTING" ] && gh release view "$HIGHEST" >/dev/null 2>&1; then
            EXISTING="$HIGHEST"
          fi
          if [ -n "$EXISTING" ]; then
            gh release edit "$EXISTING" --tag "$HIGHEST" --verify-tag \
              --title "v$VERSION" --notes-file "$BODY"
            echo "release retargeted: $EXISTING -> $HIGHEST"
          else
            gh release create "$HIGHEST" --title "v$VERSION" --notes-file "$BODY" --verify-tag --latest
            echo "created the release on $HIGHEST"
          fi
