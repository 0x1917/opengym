# Publish the image that `build.yml` built and smoke-tested.
#
# Chained with `workflow_run`: it fires when the build workflow completes, then
# downloads that exact run's artifact, proves the loaded image is the tested one
# (image ID from meta.json, plus the smoke gate run again on the loaded bytes),
# and only then pushes to Docker Hub, tags the source, and cuts the GitHub
# release.
#
# Nothing here can build. The bytes come from the artifact or they do not ship.
#
# The release body quotes upstream's changelog for the version. Upstream keeps
# each CHANGELOG.md section identical to that release's GitHub notes, so the
# text says what changed in the app rather than what changed in this packaging.
#
# Docker Hub is the release channel. A copy is also pushed to ghcr.io, best
# effort: it can fail without failing the run, because the git tag and the Hub
# tags are already final by then. A GHCR outage must not leave a red run
# pointing at a published image.
#
# Secrets (Repo Settings > Secrets and Variables > Actions):
#   DOCKERHUB_TOKEN     Docker Hub access token

name: publish

on:
  workflow_run:
    workflows: [build]
    types: [completed]
  # Manual re-publish of a specific build run: pass its run id.
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "The build run ID to publish: Open Actions > Build > Click on the run > Extract the ID from the URL."
        required: true
        type: string

permissions:
  contents: write   # push the source tag and create the release
  actions: read     # download the artifact from the triggering run
  packages: write   # best-effort copy to ghcr.io

# Publishing is serialised across runs: :latest must never be raced by two
# publishes, and the numbered tag series assumes one writer.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: 0x1917/opengym
  GHCR: ghcr.io/0x1917/opengym
  ARTIFACT: opengym-image

jobs:
  publish:
    # Chained runs publish only from master, only after a green build, and only
    # for events that were allowed to publish in the first place.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
    steps:
      # The commit to tag is the BUILD RUN's head, not this workflow's SHA: a
      # manual re-publish names a build run, and its commit is what shipped.
      # The SHA is interpolated into a checkout `ref:` below, so it is validated
      # as a bare commit hash first.
      - name: Resolve and validate the target commit
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in
            *[!0-9]*|"") echo "not a run id: $RUN_ID" >&2; exit 1 ;;
          esac
          # The run decides which commit we trust. Validate the RUN, not only
          # the SHA: a manual dispatch can name any run id, including a build of
          # a fork PR, whose code would then be checked out and executed here
          # with a write token. Only master pushes and master dispatches pass.
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          BRANCH=$(printf '%s' "$RUN" | jq -r .head_branch)
          EVENT=$(printf '%s' "$RUN" | jq -r .event)
          SHA_J=$(printf '%s' "$RUN" | jq -r .head_sha)
          case "$EVENT" in
            push|workflow_dispatch) ;;
            *) echo "build run $RUN_ID came from '$EVENT', refusing" >&2; exit 1 ;;
          esac
          [ "$BRANCH" = "master" ] || { echo "build run $RUN_ID is on '$BRANCH', not master" >&2; exit 1; }
          SHA="$SHA_J"
          [ -z "$WR_SHA" ] || [ "$WR_SHA" = "$SHA" ] || { echo "payload sha disagrees with the run" >&2; exit 1; }
          case "$SHA" in
            *[!0-9a-f]*|"") echo "not a commit sha: $SHA" >&2; exit 1 ;;
          esac
          [ "${#SHA}" -eq 40 ] || { echo "not a commit sha: $SHA" >&2; exit 1; }
          echo "publishing build run $RUN_ID ($SHA) from $EVENT on $BRANCH"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT }}
          # Outside the checkout on purpose: actions/checkout cleans the working
          # tree, which would delete a bundle downloaded into it. `runner` is
          # usable in step inputs but not in `env` blocks.
          path: ${{ runner.temp }}/bundle
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The bundle is uploaded on every build, so a missing tarball here is a
      # permission problem rather than a normal "nothing to publish".
      - name: Read the bundle manifest
        id: meta
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/bundle"
          test -s "$BUNDLE/meta.json" || { echo "no meta.json in the artifact" >&2; exit 1; }
          cat "$BUNDLE/meta.json"
          {
            echo "version=$(jq -r .version "$BUNDLE/meta.json")"
            echo "image_id=$(jq -r .image_id "$BUNDLE/meta.json")"
            echo "publish=$(jq -r .publish "$BUNDLE/meta.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Nothing to publish
        if: steps.meta.outputs.publish != 'true'
        run: echo "that build was not marked for publishing, so this run stops here"

      # Only needed when there is something to push: the smoke script and the
      # tag step both live in the repo. Placed after the manifest read so a
      # non-publish build costs one API call and a 381-byte download.
      - uses: actions/checkout@v7
        if: steps.meta.outputs.publish == 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0   # the tag step reads the remote's tags
          persist-credentials: false

      - name: Load the tested image
        if: steps.meta.outputs.publish == 'true'
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/bundle"
          test -s "$BUNDLE/image.tar.zst" || { echo "artifact has no image tarball" >&2; exit 1; }
          zstd -dc "$BUNDLE/image.tar.zst" | docker load
          GOT=$(docker image inspect --format '{{.Id}}' opengym:test)
          WANT="${{ steps.meta.outputs.image_id }}"
          echo "loaded: $GOT"
          echo "tested: $WANT"
          [ "$GOT" = "$WANT" ] || { echo "the loaded image is not the image that was tested" >&2; exit 1; }

      # The bytes travelled through an artifact store, so the gate runs again on
      # what actually arrived rather than trusting the build run's log.
      - name: Run the smoke test on the loaded image
        if: steps.meta.outputs.publish == 'true'
        run: bash scripts/smoke-test.sh opengym:test

      - name: Log in to Docker Hub
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: "0x1917"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push the image
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker tag opengym:test "$IMAGE:$VERSION"
          docker tag opengym:test "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Verify both tags carry the same digest
        id: digests
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          v=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          l=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          echo "version: $v"
          echo "latest:  $l"
          [ "$v" = "$l" ]
          echo "digest=$v" >> "$GITHUB_OUTPUT"

      # The FIRST publish of a release gets the bare tag (v1.4.3); a rebuild of
      # the same release gets the next number (v1.4.3-1, -2), so every publish
      # leaves a tag and none is ever moved. Re-running the same commit is a no-op:
      # it already carries one.
      - name: Create the source tag
        id: tag
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_RUN: ${{ env.RUN_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Checkout kept no credentials, so the push authenticates here, for
          # this step only, after the image is already published.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          BASE="v${VERSION}"
          EXISTING=$(git tag --points-at HEAD | bash scripts/version-tag.sh "$VERSION")
          if [ -n "$EXISTING" ]; then
            echo "this commit already carries $EXISTING, nothing to tag"
            echo "tag=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="$BASE"
          NOTE="Source state published as $IMAGE:$VERSION (build run $BUILD_RUN)"
          if git ls-remote --exit-code --tags origin "refs/tags/$BASE" >/dev/null 2>&1; then
            # The bare tag is taken: this is a rebuild. Number it.
            N=$(git ls-remote --tags origin | awk -v p="refs/tags/${BASE}-" \
                  'index($2, p) == 1 { n = substr($2, length(p) + 1); if (n ~ /^[0-9]+$/) print n }' \
                  | sort -n | tail -1)
            N=${N:-0}
            TAG="${BASE}-$((N + 1))"
            NOTE="Rebuild #$((N + 1)) of $IMAGE:$VERSION (release tag already exists, build run $BUILD_RUN)"
          fi
          git tag -a "$TAG" -m "$NOTE"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ---- best-effort mirror to GHCR ----------------------------------
      # Everything below runs after the Hub push, the digest check and the git
      # tag, so a failure here cannot corrupt the release record. Each step is
      # continue-on-error and the last one reports the combined outcome as a
      # warning annotation instead of a red run.
      - name: Log in to GHCR
        id: ghcr_login
        if: steps.meta.outputs.publish == 'true'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the GHCR copy
        id: ghcr_push
        if: steps.meta.outputs.publish == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker tag opengym:test "$GHCR:$VERSION"
          docker tag opengym:test "$GHCR:latest"
          docker push "$GHCR:$VERSION"
          docker push "$GHCR:latest"

      # Both registries store the same manifest bytes, so the digest is the
      # same content-addressed value on each: compare the GHCR copy against the
      # Hub tag too, not only against its own `latest`. A mismatch means the
      # mirror is not carrying the published image.
      - name: Verify the GHCR tags
        id: ghcr_verify
        if: steps.meta.outputs.publish == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          v=$(docker buildx imagetools inspect "$GHCR:$VERSION" --format '{{.Manifest.Digest}}')
          l=$(docker buildx imagetools inspect "$GHCR:latest" --format '{{.Manifest.Digest}}')
          h=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          echo "ghcr version: $v"
          echo "ghcr latest:  $l"
          echo "hub  version: $h"
          [ "$v" = "$l" ]
          [ "$v" = "$h" ]

      - name: GHCR outcome
        if: always() && steps.meta.outputs.publish == 'true'
        env:
          LOGIN: ${{ steps.ghcr_login.outcome }}
          PUSH: ${{ steps.ghcr_push.outcome }}
          VERIFY: ${{ steps.ghcr_verify.outcome }}
        run: |
          set -uo pipefail
          echo "ghcr login: $LOGIN, push: $PUSH, verify: $VERIFY"
          if [ "$LOGIN" != "success" ] || [ "$PUSH" != "success" ] || [ "$VERIFY" != "success" ]; then
            echo "::warning::GHCR mirror incomplete (login=$LOGIN push=$PUSH verify=$VERIFY); Docker Hub published, treat ${GHCR:-ghcr.io} as unavailable"
          fi

      # ---- the release record -------------------------------------------
      # Last step on purpose: everything it states has already happened, so the
      # body reports the digest that shipped and the mirror outcome instead of a
      # prediction. Upstream's CHANGELOG.md is the changelog: its own header
      # says each release section is the GitHub release notes word for word, so
      # the section for this version is quoted verbatim.
      - name: Create or update the GitHub release
        if: success() && steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.digests.outputs.digest }}
          SHA: ${{ steps.target.outputs.sha }}
          BUILD_RUN: ${{ env.RUN_ID }}
          GHCR_PUSH: ${{ steps.ghcr_push.outcome }}
          GHCR_VERIFY: ${{ steps.ghcr_verify.outcome }}
          UPSTREAM: DuarteSantos8/openGym
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${TAG:-}" ] || { echo "no source tag resolved for v$VERSION, refusing to guess" >&2; exit 1; }

          WORK="$RUNNER_TEMP"
          NOTES="$WORK/upstream-notes.md"
          CHANGELOG="$WORK/CHANGELOG.md"

          # Raw media type: the file arrives as bytes, not base64 inside JSON.
          if gh api -H "Accept: application/vnd.github.raw" \
               "repos/$UPSTREAM/contents/CHANGELOG.md" > "$CHANGELOG" 2>/dev/null; then
            awk -v v="$VERSION" '
              $0 ~ "^## v" v "($|[ (])" { on = 1; next }
              on && /^## v/ { exit }
              on { print }
            ' "$CHANGELOG" > "$NOTES"
          else
            : > "$NOTES"
          fi

          # Fallback: the upstream release for the tag, which carries the same text.
          if [ ! -s "$NOTES" ]; then
            echo "no changelog section for v$VERSION, trying the upstream release" >&2
            gh api "repos/$UPSTREAM/releases/tags/v$VERSION" --jq .body > "$NOTES" 2>/dev/null || : > "$NOTES"
          fi
          [ -s "$NOTES" ] || echo "_Upstream published no notes for this version._" > "$NOTES"

          MIRROR="not published in this run"
          if [ "${GHCR_PUSH:-}" = "success" ] && [ "${GHCR_VERIFY:-}" = "success" ]; then
            MIRROR="mirrored and digest-checked"
          fi

          BODY="$WORK/release.md"
          {
            printf 'Container image for OpenGym v%s, built from the upstream release and smoke-tested before publication.\n\n' "$VERSION"
            printf -- "- \`%s:%s\` and \`%s:latest\` on Docker Hub\n" "$IMAGE" "$VERSION" "$IMAGE"
            printf -- "- \`%s:%s\` and \`:latest\`, %s\n" "$GHCR" "$VERSION" "$MIRROR"
            printf -- "- digest: \`%s\`\n" "${DIGEST:-unknown}"
            printf -- "- tag commit: %s\n" "$SHA"
            printf -- "- build run: %s/%s/actions/runs/%s\n\n" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BUILD_RUN"
            printf '## What changed in v%s\n\n' "$VERSION"
            cat "$NOTES"
            printf '\n---\nChangelog from [OpenGym v%s](https://github.com/%s/releases/tag/v%s), quoted as published.\n' "$VERSION" "$UPSTREAM" "$VERSION"
          } > "$BODY"

          # One release per version. A rebuild bumps the source tag, so the
          # release is retargeted onto that numbered tag rather than left
          # pointing at the commit it was first cut from.
          EXISTING=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | bash scripts/version-tag.sh "$VERSION")
          # The list is capped, so a release beyond the cap is looked up directly
          # instead of falling through to a create that would 422 on the tag.
          if [ -z "$EXISTING" ] && gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING="$TAG"
          fi
          if [ -n "$EXISTING" ]; then
            gh release edit "$EXISTING" --tag "$TAG" --verify-tag \
              --title "v$VERSION" --notes-file "$BODY"
            echo "release retargeted: $EXISTING -> $TAG"
          else
            gh release create "$TAG" --title "v$VERSION" --notes-file "$BODY" --verify-tag --latest
            echo "created the release on $TAG"
          fi
