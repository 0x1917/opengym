# Build and smoke-test the opengym image.
#
# This workflow NEVER writes to the registry. When the change set touches a
# build input it exports the tested image as a compressed tarball artifact plus
# a small metadata file, and `publish.yml` picks that up via
# `workflow_run`. Secrets stay in the publish workflow.
#
# Version comes from `ARG UPSTREAM_VERSION` in the Dockerfile.

name: build

on:
  # Every push builds, on any branch and any path: the build is cheap and always
  # informative. What republishes is decided inside the job by the scope step,
  # which requires master AND a diff in the build inputs.
  push:
  # Every PR runs the build, no path filter: the master ruleset requires the
  # "build" status check, and a PR that produced no check would wait forever.
  pull_request:
  # Weekly rebuild: exercises the pipeline on a schedule, so a broken upstream
  # tag, a missing asset, or a dead base image shows up as a red run instead of
  # waiting for the next manual bump.
  schedule:
    - cron: "0 5 * * 1"
  # Manual run. `force_publish=true` marks the build as publishable even though
  # nothing changed: a dispatch run is never diffed. Without the input
  # it builds and smokes only, which is the safe default.
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish image"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write      # upload the image artifact for the publish workflow

# One build at a time per ref: two pushes in quick succession would otherwise
# race the artifact and, downstream, the :latest tag.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: 0x1917/opengym
  # Tarball size is ~265 MB compressed; 3 days is enough for the chained run.
  ARTIFACT: opengym-image
  RETENTION: 3

jobs:
  build:
    # The check context equals this name (or the ID when omitted). The master
    # ruleset requires the status check "build", so changing either silently
    # disarms the gate.
    name: build
    runs-on: ubuntu-latest
    # A hung buildx step otherwise burns the 6h default; a healthy run is ~1 min.
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The scope check below diffs the last published tag against HEAD.
          fetch-depth: 0

      # Only the paths that reach the image count: .github/build-inputs lists
      # them, and lint fails if the Dockerfile copies from anywhere else, so a
      # new COPY source cannot change the image without publishing it.
      #
      # The baseline is the highest source tag, i.e. what last shipped, not
      # github.event.before: after a force-push that sha is orphaned and absent
      # from the clone, and a push that only amends a README commit must not
      # republish. A failed publish leaves no tag, so the next push retries it.
      - name: Determine if image was updated
        id: scope
        if: github.event_name != 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force_publish }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$FORCE" = "true" ]; then
              echo "forced by the dispatch input, packaging for publish"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "forced=true" >> "$GITHUB_OUTPUT"
            else
              echo "dispatch without force_publish, so build and smoke run but nothing is published"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # A feature branch runs builds and smoke tests but only master publishes
          if [ "$EVENT" = "schedule" ]; then
            echo "scheduled run, so build and smoke only"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "not master, so build and smoke only"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(git tag -l 'v*' | bash scripts/version-tag.sh --max)
          INPUTS=()
          while IFS= read -r p; do INPUTS+=("$p"); done < <(grep -vE '^[[:space:]]*(#|$)' .github/build-inputs)
          if [ -z "$LAST" ] || ! git diff --quiet "$LAST" "$GITHUB_SHA" -- "${INPUTS[@]}"; then
            echo "build inputs changed since ${LAST:-no release tag yet}, packaging for publish"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "no build input changed, so build and smoke run but nothing is published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version from the Dockerfile
        id: meta
        run: |
          UP=$(grep -m1 '^ARG UPSTREAM_VERSION=' Dockerfile | cut -d= -f2)
          test -n "$UP"
          # Tag = the bare upstream release; the Dockerfile derives the same
          # value for the OCI version label. build_date is git-formatted (%cI)
          # so the value is always well-formed, never interpolate commit
          # metadata into `with:` blocks directly.
          {
            echo "version=$UP"
            echo "api=$(bash scripts/image-ref.sh OPENGYM_API_REPO "$UP")"
            echo "build_date=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Only feeds the provenance label: the Dockerfile itself pins by tag.
      - name: Resolve base image digest
        id: digest
        run: echo "base_digest=$(docker buildx imagetools inspect ${{ steps.meta.outputs.api }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: opengym:test
          # This job holds no registry credentials, so the cache lives in the
          # Actions cache both ways. A pushed image carries no cache metadata,
          # so :latest would be no use as a cache source either.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            BASE_DIGEST=${{ steps.digest.outputs.base_digest }}

      - name: Run smoke test
        run: bash scripts/smoke-test.sh opengym:test

      - name: Write the bundle manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PUBLISH: ${{ steps.scope.outputs.publish }}
          FORCED: ${{ steps.scope.outputs.forced || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          ID=$(docker image inspect --format '{{.Id}}' opengym:test)
          jq -n --arg v "$VERSION" --arg id "$ID" --arg img "$IMAGE" \
                --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
                --argjson pub "${PUBLISH:-false}" --argjson forced "$FORCED" \
                '{version:$v, image_id:$id, image:$img, commit:$sha, build_run:$run, publish:$pub, forced:$forced}' \
                > "$RUNNER_TEMP/bundle/meta.json"
          cat "$RUNNER_TEMP/bundle/meta.json"

      # Hand the EXACT image that just passed the gate to the publish workflow.
      # The image ID in meta.json lets the publish side prove the bytes it
      # loaded are the bytes tested here.
      - name: Package the tested image
        if: steps.scope.outputs.publish == 'true'
        run: |
          set -euo pipefail
          docker save opengym:test | zstd -T0 -3 -q -o "$RUNNER_TEMP/bundle/image.tar.zst"
          ls -lh "$RUNNER_TEMP/bundle"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/bundle
          retention-days: ${{ env.RETENTION }}
          # The tarball is already compressed by zstd.
          compression-level: 0
